services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      DATA_DIR: /data
      DATABASE_PATH: /data/jobs.db
      OUTPUT_DIR: /data/outputs
      WEIGHTS_DIR: /data/weights
      # Auth + absolute result URLs; pulled from host env / .env (empty if unset).
      API_TOKEN: ${API_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - app-data:/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    # Run multiple worker instances: docker compose up --scale worker=3
    environment:
      REDIS_HOST: redis
      DATA_DIR: /data
      DATABASE_PATH: /data/jobs.db
      OUTPUT_DIR: /data/outputs
      WEIGHTS_DIR: /data/weights
      USE_GPU: "true"
      # Return absolute result URLs; pulled from host env / .env (empty if unset).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - app-data:/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Ephemeral public URL (no Cloudflare account needed), prints a
  # *.trycloudflare.com address. Start with:
  #   docker compose --profile tunnel-quick up -d
  #   docker compose logs -f cloudflared-quick   # find the URL
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://api:8000
    depends_on:
      - api
    profiles: ["tunnel-quick"]

  # Persistent named tunnel bound to your own domain. Create the tunnel in the
  # Cloudflare Zero Trust dashboard, set its public hostname to http://api:8000,
  # put the token in .env (CLOUDFLARE_TUNNEL_TOKEN), then start with:
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api
    profiles: ["tunnel"]

volumes:
  app-data:
